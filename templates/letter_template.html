<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @page {
    size: A4;
    margin: 18mm 20mm;
  }
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: #2c3e50;
    margin: 0;
    font-size: 10pt;
    line-height: 1.55;
  }
  a { color: #1e3d59; text-decoration: none; }
  header {
    border-bottom: 2px solid #000;
    padding-bottom: 10px;
    margin-bottom: 16px;
  }
  .name { font-size: 18pt; font-weight: 700; color: #000; text-transform: uppercase; line-height: 1.15; }
  .title-line { font-size: 10pt; font-weight: 600; color: #000; text-transform: uppercase; margin-top: 2px; }
  .contact { font-size: 8.5pt; color: #555; margin-top: 4px; }
  .meta { margin-bottom: 14px; }
  .date { font-size: 9.5pt; color: #7f8c8d; }
  .subject {
    font-size: 11pt; font-weight: 700; color: #000;
    border-bottom: 1px solid #000; padding-bottom: 3px;
    margin-bottom: 10px;
  }
  .greeting { font-weight: 600; margin-bottom: 10px; }
  .body p { text-align: justify; margin: 0 0 10px 0; }
  .closing { margin-top: 12px; }
  .signature { margin-top: 14px; }
  .sig-name { font-size: 12pt; font-weight: 700; color: #000; }
  .sig-role { font-size: 9.5pt; font-weight: 600; color: #000; }
  .sig-links { font-size: 8.5pt; color: #555; margin-top: 2px; }
</style>
</head>
<body>

<header>
  <div class="name">{{ name }}</div>
  <div class="title-line">{{ title }}</div>
  <div class="contact">{{ email }} | {{ phone }} | {{ location }}</div>
</header>

<div class="meta">
  <div class="date">{{ date }}</div>
</div>

<div class="subject">{{ subject }}</div>

<div class="greeting">{{ recipient }}</div>

<div class="body">
{% for para in paragraphs %}
<p>{{ para }}</p>
{% endfor %}
</div>

<div class="closing">{{ closing }}</div>

<div class="signature">
  <div class="sig-name">{{ name }}</div>
  <div class="sig-role">{{ title }}</div>
  <div class="sig-links">
    <a href="https://{{ linkedin }}">{{ linkedin }}</a>{% if portfolio %} · <a href="https://{{ portfolio }}">{{ portfolio }}</a>{% endif %}
  </div>
</div>

</body>
</html>
